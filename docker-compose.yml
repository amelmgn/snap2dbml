services:
  snap2dbml:
    # Pinned to the prod image tag. For stricter pinning set IMAGE_TAG to an
    # immutable sha tag (e.g. IMAGE_TAG=sha-d8cf9b3) in .env — then `pull`
    # can never change the running version unexpectedly.
    image: ghcr.io/${GHCR_OWNER}/snap2dbml:${IMAGE_TAG:-prod}
    restart: unless-stopped
    ports:
      - "3000:3000"
    env_file:
      - .env
    # Uncomment when enabling the built-in sync scheduler (SYNC_CONFIG in .env):
    # volumes:
    #   - ./sync.json:/app/sync.json:ro
