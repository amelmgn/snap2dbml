# Staging instance — runs alongside production on the same host.
#
# IMPORTANT: a staging sync configuration must point at a test repository (or a
# separate branch/directory), never at paths managed by production.
services:
  snap2dbml-stage:
    image: ghcr.io/${GHCR_OWNER}/snap2dbml:${STAGE_IMAGE_TAG:-stage}
    container_name: snap2dbml-stage
    restart: unless-stopped
    ports:
      - "3001:3000"
    env_file:
      - .env
    environment:
      # The host port is mapped above; the server must keep listening on 3000
      # inside the container regardless of the environment file.
      PORT: 3000
    # Cap Docker's log storage; without this the json-file driver grows unbounded.
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"
    # Uncomment when testing the built-in sync scheduler:
    # volumes:
    #   - ./sync.json:/app/sync.json:ro
